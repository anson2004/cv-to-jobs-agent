name: local-llm-run

# Twice-weekly pipeline run on a local model (Ollama in Docker, CPU only). No LLM API keys.
#
# Two modes, picked by whether the CV_URL secret is set:
# - CV_URL set (a direct-download link to your CV): emails the picks through
#   Resend (needs RESEND_API_KEY and TO_EMAIL secrets), remembers sent jobs
#   between runs, and keeps CV details out of the public logs, artifacts and cache.
# - not set: uses the sample CV, dry run, uploads the email and trace as artifacts.
# Optional repository variables: LOCATION (e.g. Tampere) sets the location filter;
# DUUNITORI_ENABLED=true adds Finland's main job board, the only source with
# Finnish on-site jobs (opt-in: its robots.txt disallows bots, see README).
# Debugging your CV mode: DEBUG_LOGS=true prints the scored jobs (titles and
# scores only) to the log, and with a LOG_KEY secret also uploads the full run
# log, traces and email as an encrypted artifact (see README to decrypt).

on:
  schedule:
    - cron: "0 5 * * 1,4"  # Mon + Thu 05:00 UTC; caches expire after 7 days unused
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model for every step
        default: qwen3:8b
      max_jobs:
        description: Jobs to score (each is one call, ~1 min on CPU)
        default: "15"
      location:
        description: Location filter, e.g. Tampere (empty = repository variable LOCATION)
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Scheduled runs have no inputs, hence the fallbacks.
      OLLAMA_MODEL: ${{ inputs.model || 'qwen3:8b' }}
      MODEL_STRONG: ${{ inputs.model || 'qwen3:8b' }}
      MODEL_FAST: ${{ inputs.model || 'qwen3:8b' }}
      MAX_JOBS: ${{ inputs.max_jobs || '15' }}
      LOCATION: ${{ inputs.location || vars.LOCATION }}
      DUUNITORI_ENABLED: ${{ vars.DUUNITORI_ENABLED }}  # empty = off
      DEBUG_LOGS: ${{ vars.DEBUG_LOGS }}  # empty = off
      COLUMNS: "200"  # rich wraps console lines at 80 without a terminal
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: ollama
      REASONING_EFFORT: none  # thinking on CPU eats the token budget
      LLM_TIMEOUT_S: "600"
      SCORE_CONCURRENCY: "1"
      PRIVATE_CV: ${{ secrets.CV_URL != '' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
    steps:
      - name: Check email secrets (your CV mode)
        if: env.PRIVATE_CV == 'true'
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$TO_EMAIL" ]; then
            echo "::error::CV_URL is set, so results are emailed, not uploaded. Add the RESEND_API_KEY and TO_EMAIL secrets."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Restore model
        uses: actions/cache@v4
        with:
          path: data/ollama
          key: ollama-0.35.1-${{ env.OLLAMA_MODEL }}

      - run: docker compose up -d --wait ollama
      - run: docker compose run --rm pull  # quick no-op when the cache hit

      # ---- sample CV: dry run, outputs are public artifacts ------------------
      - name: Run (sample CV)
        if: env.PRIVATE_CV != 'true'
        run: uv run jobad run --dry-run --max-jobs "$MAX_JOBS"

      - uses: actions/upload-artifact@v4
        if: always() && env.PRIVATE_CV != 'true'
        with:
          name: run-output
          path: |
            data/out/
            data/traces/

      # ---- your CV: email only, nothing about the CV in logs/artifacts/cache --
      - name: Restore sent-jobs memory
        if: env.PRIVATE_CV == 'true'
        uses: actions/cache@v4
        with:
          path: data/jobad.sqlite
          key: jobad-db-${{ github.run_id }}
          restore-keys: jobad-db-

      - name: Download CV
        if: env.PRIVATE_CV == 'true'
        env:
          CV_URL: ${{ secrets.CV_URL }}
        run: curl -fsSL "${CV_URL/dl=0/dl=1}" -o "$RUNNER_TEMP/cv.pdf"

      - name: Run (your CV, output hidden)
        if: env.PRIVATE_CV == 'true'
        run: |
          if uv run jobad run "$RUNNER_TEMP/cv.pdf" --max-jobs "$MAX_JOBS" > "$RUNNER_TEMP/run.log" 2>&1; then
            grep -E "^(verify|llm calls) " "$RUNNER_TEMP/run.log" || true  # counts only, no CV details
          else
            echo "::error::Run failed. Output is hidden because it contains CV details; reproduce locally."
            exit 1
          fi

      - name: Scored jobs (DEBUG_LOGS; titles and scores only, no CV text)
        if: always() && env.PRIVATE_CV == 'true' && env.DEBUG_LOGS == 'true'
        run: cat data/out/*.jobs.txt 2>/dev/null || echo "No jobs report, the run stopped before scoring."

      - name: Encrypt run log, traces and email (DEBUG_LOGS + LOG_KEY)
        if: always() && env.PRIVATE_CV == 'true' && env.DEBUG_LOGS == 'true'
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          if [ -z "$LOG_KEY" ]; then
            echo "::warning::DEBUG_LOGS is on but the LOG_KEY secret is not set; no encrypted log uploaded."
            exit 0
          fi
          cp "$RUNNER_TEMP/run.log" data/run.log 2>/dev/null || true
          (cd data && tar czf "$RUNNER_TEMP/run-log.tar.gz" $(ls -d run.log traces out 2>/dev/null))
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -in "$RUNNER_TEMP/run-log.tar.gz" -out "$RUNNER_TEMP/run-log.enc" -pass env:LOG_KEY
          rm -f "$RUNNER_TEMP/run-log.tar.gz" data/run.log

      - uses: actions/upload-artifact@v4
        if: always() && env.PRIVATE_CV == 'true' && env.DEBUG_LOGS == 'true'
        with:
          name: run-log
          path: ${{ runner.temp }}/run-log.enc
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep only sent job ids in the cached database
        if: always() && env.PRIVATE_CV == 'true'
        run: |
          if [ -f data/jobad.sqlite ]; then
            sqlite3 data/jobad.sqlite "UPDATE runs SET profile_json = NULL, summary_json = NULL; DELETE FROM scores; VACUUM;"
          fi

      - name: Let the cache step read the model files (written by root in the container)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" data/ollama
