[project]
name = "jobad"
version = "0.1.0"
description = "Agentic job-ad orchestrator: one CV in, four reasoned recommendations out."
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "resend>=2.0",
    "rich>=13.0",
]

[project.scripts]
jobad = "jobad.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "fpdf2>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
