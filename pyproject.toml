[project]
name = "jobad"
version = "0.1.0"
description = "Agentic job-ad orchestrator: one CV in, four reasoned recommendations out."
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "typer>=0.15",
    "jinja2>=3.1",
    "resend>=2.0",
    "rich>=13.0",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
jobad = "jobad.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.8",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
